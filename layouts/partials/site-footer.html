<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-copy">&copy; {{ now.Year }} {{ site.Title }} <span class="dot-sep">/</span> Built with Hugo</p>
    <div class="footer-links">
      <a href="https://github.com/{{ site.Params.github }}" target="_blank" rel="noopener">GitHub</a>
      {{ with site.Home.OutputFormats.Get "RSS" }}<a href="{{ .RelPermalink }}">RSS</a>{{ end }}
    </div>
  </div>
</footer>
