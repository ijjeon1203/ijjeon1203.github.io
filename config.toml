theme = "ananke"
baseURL = "https://ijjeon1203.github.io/"
languageCode = "ko-kr"
title = "JJunney's Blog"
enableGitInfo = true
pluralizeListTitles = false

[params]
github = "ijjeon1203"
description = "리눅스 · 임베디드 · MLOps · Python 공부 기록"

# front matter에 date가 없는 글은 git 커밋 날짜를 사용
[frontmatter]
date = ["date", "publishDate", ":git"]
lastmod = [":git", "lastmod", "date"]

[markup]
  [markup.highlight]
    style = "github-dark"
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
